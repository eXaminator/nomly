<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <title>nomly mascot — reference sketch (Epic 8 spec)</title>
  <desc>Reference SVG for the nomly mascot icon. Direction locked during brainstorming on 2026-05-26. Final production artwork is iterated in the implementation PR; this file is a starting point, not the shipped asset.</desc>

  <!-- Ground shadow (drawn first so the body sits on top) -->
  <ellipse cx="100" cy="191" rx="52" ry="5" fill="#A85718" opacity="0.3" />

  <!-- Body -->
  <ellipse cx="100" cy="102" rx="86" ry="88" fill="#E1721F" />

  <!-- Eyes (^_^) -->
  <path d="M 36 76 Q 64 46, 92 76"   stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M 108 76 Q 136 46, 164 76" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Cheek blush -->
  <ellipse cx="56"  cy="112" rx="11" ry="7" fill="#F2A66B" opacity="0.75" />
  <ellipse cx="144" cy="112" rx="11" ry="7" fill="#F2A66B" opacity="0.75" />

  <!-- Mouth (curved smile + warm tongue hint) -->
  <path d="M 60 136 Q 100 172, 140 136" stroke="#1A1A1A" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M 76 144 Q 100 162, 124 144 Z" fill="#C0392B" opacity="0.5" />
</svg>
