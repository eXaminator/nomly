# Self-hosted nomly stack. Copy this to `docker-compose.yml`, copy
# `.env.example` to `.env` and fill in your Authentik (or other OIDC IdP)
# values, then `docker compose up -d`.

services:
  nomly:
    image: ghcr.io/examinator/nomly:latest
    restart: unless-stopped
    ports:
      # Map this to your reverse proxy if you're terminating TLS upstream;
      # otherwise expose 3000 directly on the LAN.
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    # All required env vars live in .env — see .env.example.
    # Notable Authentik wiring:
    #   BASE_URL=https://nomly.your-domain.tld
    #   OIDC_ISSUER=https://auth.your-domain.tld/application/o/nomly/
    #   OIDC_CLIENT_ID=...    (the "Client ID" from Authentik's app config)
    #   OIDC_CLIENT_SECRET=...
    #   SESSION_SECRET=...    (>= 32 chars; `openssl rand -base64 32` is fine)
    # Optional:
    #   OIDC_END_SESSION_URL=https://auth.your-domain.tld/application/o/nomly/end-session/
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Optional: TLS-terminating reverse proxy. Pick ONE if you don't already
  # --- have one running. Both stanzas are commented out by default.

