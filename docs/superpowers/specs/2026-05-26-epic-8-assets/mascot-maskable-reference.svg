<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <title>nomly mascot — maskable reference sketch (Epic 8 spec)</title>
  <desc>Maskable variant — orange paints to the edges so Android adaptive icons can crop to platform shapes. Face features are traced in cream so they pop against the orange ground.</desc>

  <!-- Full-bleed background (maskable safe area is the inner 80% — content is inset) -->
  <rect x="0" y="0" width="200" height="200" fill="#E1721F" />

  <!-- Subtle inner shadow at the foot of the mascot -->
  <ellipse cx="100" cy="166" rx="42" ry="4" fill="#7E3F0F" opacity="0.4" />

  <!-- Body — outlined in cream to be visible on the same-orange ground -->
  <ellipse cx="100" cy="100" rx="64" ry="66" fill="#E1721F" stroke="#FFE8CC" stroke-width="3" />

  <!-- Eyes -->
  <path d="M 52 84 Q 73 62, 95 84"   stroke="#FFF8EF" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M 105 84 Q 127 62, 148 84" stroke="#FFF8EF" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Cheek blush -->
  <ellipse cx="68"  cy="108" rx="8" ry="5" fill="#FFD8A3" opacity="0.6" />
  <ellipse cx="132" cy="108" rx="8" ry="5" fill="#FFD8A3" opacity="0.6" />

  <!-- Mouth -->
  <path d="M 70 128 Q 100 154, 130 128" stroke="#FFF8EF" stroke-width="6" fill="none" stroke-linecap="round" />
</svg>
